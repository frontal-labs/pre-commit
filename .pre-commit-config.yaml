# Pre-commit framework configuration for this repository (self-test).
#
# When you contribute to this repo, pre-commit will run the hooks against
# your staged changes — the same hooks that external consumers use.
fail_fast: false
default_install_hook_types: [ pre-commit, commit-msg ]

repos:
  - repo: local
    hooks:
      - id: frontal-biome
        name: frontal biome check
        entry: sh -c 'node hooks/ensure-tool.mjs pnpm && pnpm exec biome check --no-errors-on-unmatched "$@"'
        language: system
        files: \.(ts|tsx|js|jsx|json)$
        exclude: "^packages/design-system/"
        stages: [ pre-commit ]

      - id: frontal-ruff
        name: frontal ruff check + format
        entry: sh -c 'node hooks/ensure-tool.mjs ruff && ruff check "$@" && ruff format --check "$@"'
        language: system
        files: \.py$
        exclude: "(^|/)(vendor|gen|generated|node_modules)/"
        stages: [ pre-commit ]

      - id: frontal-rustfmt
        name: frontal rustfmt (staged)
        entry: sh -c 'node hooks/ensure-tool.mjs rustfmt && rust_files=$(git diff --cached --name-only --diff-filter=ACMR -- "*.rs" | grep -vE "(^|/)gen/" || true); if [ -n "$rust_files" ]; then printf "%s\n" "$rust_files" | xargs rustfmt --edition 2024 --check; fi'
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [ pre-commit ]

      - id: frontal-clippy
        name: frontal cargo clippy (scoped)
        entry: sh -c 'node hooks/ensure-tool.mjs cargo && node hooks/clippy-scoped.mjs'
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [ pre-commit ]

      - id: frontal-go-vet
        name: frontal go vet (scoped)
        entry: sh -c 'node hooks/ensure-tool.mjs go && node hooks/go-vet-scoped.mjs'
        language: system
        files: \.go$
        pass_filenames: false
        stages: [ pre-commit ]

      - id: frontal-buf-lint
        name: frontal buf lint (scoped)
        entry: sh -c 'node hooks/ensure-tool.mjs buf && node hooks/buf-lint-scoped.mjs'
        language: system
        files: \.proto$
        pass_filenames: false
        stages: [ pre-commit ]

      - id: frontal-commit-msg
        name: frontal commit-msg (Conventional Commits)
        # The commit-msg file arrives as the first positional param, which
        # `sh -c` consumes as $0.  The hook reads from that path (or stdin).
        entry: sh -c 'node hooks/check-commit-message.mjs "$0"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [ commit-msg ]
